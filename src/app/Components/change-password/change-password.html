<div class="toast-wrapper fade-in" *ngIf="toastMessage" [ngClass]="toastType">
  <div class="toast-content">
    <div class="icon">
      <i *ngIf="toastType === 'success'" class="ph-bold ph-check-circle"></i>
      <i *ngIf="toastType === 'error'"   class="ph-bold ph-x-circle"></i>
      <i *ngIf="toastType === 'warning'" class="ph-bold ph-warning"></i>
      <i *ngIf="toastType === 'info'"    class="ph-bold ph-info"></i>
    </div>
    <div class="toast-body">
      <p class="toast-title">
        {{ toastType === 'success' ? 'Success' : toastType === 'error' ? 'Error' : 'Notice' }}
      </p>
      <p class="toast-msg">{{ toastMessage }}</p>
    </div>
  </div>
  <div class="toast-progress"></div>
</div>

<div class="dashboard-container">

  <app-admin-sidebar *ngIf="isAdmin"
    (close)="closeSidebar()" 
    [isOpen]="isSidebarOpen">
  </app-admin-sidebar>
  <app-student-sidebar *ngIf="!isTeacher" pageTitle="Change Password" [isOpen]="isSidebarOpen" (toggle)="toggleSidebar()" (close)="closeSidebar()"></app-student-sidebar>
  <app-teacher-sidebar *ngIf="isTeacher" pageTitle="Change Password" [isOpen]="isSidebarOpen" (toggle)="toggleSidebar()" (close)="closeSidebar()" (goProblems)="back()" (goAddStatement)="router.navigate(['/Statement'])" (goCampus)="router.navigate(['/campusAdd'])" (logoutClick)="logout()"></app-teacher-sidebar>

  <main class="main-content">
    <div class="cp-wrapper">
      <div class="cp-card fade-in">
        <div class="cp-header">
          <div class="cp-icon"><i class="ph-bold ph-lock-key-open"></i></div>
          <div>
            <h2>Change Password</h2>
            <p>Keep your account secure with a strong password.</p>
          </div>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="cp-form">
          <div class="field" [class.has-error]="f['oldPassword'].touched && f['oldPassword'].invalid">
            <label>Current Password <span class="req">*</span></label>
            <div class="input-wrap">
              <input [type]="showOld ? 'text' : 'password'" formControlName="oldPassword" placeholder="Enter current password">
              <button type="button" class="eye-btn" (click)="showOld = !showOld">
                <i class="ph-bold" [class.ph-eye]="!showOld" [class.ph-eye-slash]="showOld"></i>
              </button>
            </div>
          </div>

          <div class="field" [class.has-error]="f['newPassword'].touched && f['newPassword'].invalid">
            <label>New Password <span class="req">*</span></label>
            <div class="input-wrap">
              <input [type]="showNew ? 'text' : 'password'" formControlName="newPassword" placeholder="Min 8 chars, uppercase, number">
              <button type="button" class="eye-btn" (click)="showNew = !showNew">
                <i class="ph-bold" [class.ph-eye]="!showNew" [class.ph-eye-slash]="showNew"></i>
              </button>
            </div>
          </div>

          <div class="field" [class.has-error]="f['confirmPassword'].touched && (f['confirmPassword'].invalid || form.errors?.['mismatch'])">
            <label>Confirm New Password <span class="req">*</span></label>
            <div class="input-wrap">
              <input [type]="showConfirm ? 'text' : 'password'" formControlName="confirmPassword" placeholder="Re-enter new password">
              <button type="button" class="eye-btn" (click)="showConfirm = !showConfirm">
                <i class="ph-bold" [class.ph-eye]="!showConfirm" [class.ph-eye-slash]="showConfirm"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="submit-btn" [disabled]="isLoading">
            <span *ngIf="!isLoading"><i class="ph-bold ph-check"></i> Update Password</span>
            <span *ngIf="isLoading" class="btn-loading">
              <span class="btn-spinner"></span> Updating...
            </span>
          </button>
        </form>
      </div>
    </div>
  </main>
</div>
