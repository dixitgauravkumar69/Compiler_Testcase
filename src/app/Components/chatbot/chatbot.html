<!-- Floating Chat Button -->
<button
  class="chat-fab"
  (click)="toggleChat()"
  [class.open]="isOpen()"
  aria-label="Toggle chatbot">
  <span class="fab-icon">
    @if (isOpen()) {
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    } @else {
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
    }
  </span>
  @if (!isOpen()) {
    <span class="fab-pulse"></span>
  }
</button>

<!-- Chat Window -->
@if (isOpen()) {
  <div class="chat-window" role="dialog" aria-label="Chatbot">
    <!-- Header -->
    <div class="chat-header">
      <div class="header-avatar">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 16v-4M12 8h.01"></path>
        </svg>
      </div>
      <div class="header-info">
        <span class="header-title">AI Assistant</span>
        <span class="header-status">
          <span class="status-dot"></span> Online
        </span>
      </div>
      <button class="close-btn" (click)="toggleChat()" aria-label="Close chat">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Messages -->
    <div class="chat-messages" #messagesContainer>
      @for (msg of messages(); track $index) {
        <div class="message-row" [class.user-row]="msg.role === 'user'" [class.bot-row]="msg.role === 'bot'">
          @if (msg.role === 'bot') {
            <div class="bot-avatar">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 16v-4M12 8h.01"></path>
              </svg>
            </div>
          }
          <div class="message-bubble" [class.user-bubble]="msg.role === 'user'" [class.bot-bubble]="msg.role === 'bot'">
            @if (msg.loading) {
              <div class="typing-indicator">
                <span></span><span></span><span></span>
              </div>
            } @else {
              {{ msg.text }}
            }
          </div>
        </div>
      }
    </div>

    <!-- Input -->
    <div class="chat-input-area">
      <textarea
        class="chat-input"
        [(ngModel)]="userInput"
        (keydown)="onKeyDown($event)"
        placeholder="Ask me anything..."
        rows="1"
        aria-label="Type your message"
      ></textarea>
      <button
        class="send-btn"
        (click)="sendMessage()"
        [disabled]="!userInput.trim()"
        aria-label="Send message"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
}
