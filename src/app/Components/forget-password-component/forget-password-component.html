<div class="reset-wrapper">
  <div class="reset-card">

    <div class="header">
      <div class="header-icon">🔑</div>
      <h2>Reset Password</h2>
      <p>Update your account password securely.</p>
    </div>

    <form (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label>New Password</label>
        <div class="input-box">
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="Enter new password"
            required />
          <span (click)="togglePassword()" title="Toggle visibility">
            {{ showPassword ? '🙈' : '👁' }}
          </span>
        </div>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <div class="input-box">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            placeholder="Re-enter new password"
            required />
          <span (click)="toggleConfirmPassword()" title="Toggle visibility">
            {{ showConfirmPassword ? '🙈' : '👁' }}
          </span>
        </div>
      </div>

      <button type="submit" [disabled]="isLoading">
        <span class="loader" *ngIf="isLoading"></span>
        <span>{{ isLoading ? 'Processing...' : 'Reset Password →' }}</span>
      </button>

    </form>

    <p class="error"   *ngIf="error">⚠️ {{ error }}</p>
    <p class="success" *ngIf="success">✅ {{ success }}</p>

  </div>
</div>
