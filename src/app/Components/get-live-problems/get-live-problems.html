<div class="dashboard-wrapper">
  <app-student-sidebar
    pageTitle="Live Challenges"
    [isOpen]="isSidebarOpen"
    (toggle)="toggleSidebar()"
    (close)="closeSidebar()">
  </app-student-sidebar>

  <div class="main-content">
    <div class="header-section">
      <h2><span class="pulse-icon"></span> Live Challenges</h2>
    </div>

    <div *ngIf="isLoading && problemStatements.length === 0" class="loading-container">
       <div class="spinner"></div>
       <p>Searching for live problems...</p>
    </div>

    <div *ngIf="problemStatements.length > 0; else noData" class="table-responsive">
       </div>

    <ng-template #noData>
       <div *ngIf="!isLoading" class="empty-state-container">
          <div class="empty-icon">📂</div>
          <h3>No Problems Available</h3>
          <p>Currently there is no any problem available for while wait..</p>
          <button class="btn-refresh" (click)="getLiveProblems()">Check Again</button>
       </div>
    </ng-template>
  </div>
</div>
