<div class="logout-page">

  <!-- Animated background orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Grid overlay -->
  <div class="grid-overlay"></div>

  <div class="logout-card" [class.done]="done">

    <!-- Top accent line -->
    <div class="card-accent"></div>

    <!-- Status icon area -->
    <div class="icon-area">

      <!-- Spinner ring -->
      <div class="spinner-ring" *ngIf="!done">
        <div class="ring"></div>
        <div class="ring-inner"></div>
        <div class="lock-icon">
          <i class="ph-bold ph-lock-key"></i>
        </div>
      </div>

      <!-- Success state -->
      <div class="success-ring" *ngIf="done">
        <svg class="checkmark" viewBox="0 0 52 52">
          <circle class="check-circle" cx="26" cy="26" r="24" fill="none"/>
          <path class="check-path" fill="none" d="M14 27l8 8 16-16"/>
        </svg>
      </div>

    </div>

    <!-- Text content -->
    <div class="text-area">
      <h1 class="title" [class.title-done]="done">
        {{ done ? 'See You Soon!' : 'Signing Out...' }}
      </h1>
      <p class="subtitle">
        {{ done
          ? 'Your session has been cleared. Redirecting to login...'
          : 'Clearing your session and securing your workspace.' }}
      </p>
    </div>

    <!-- Steps (shown while logging out) -->
    <div class="steps" *ngIf="!done">
      <div class="step" [class.active]="step >= 1" [class.done-step]="step > 1">
        <div class="step-dot"></div>
        <span>Revoking session token</span>
      </div>
      <div class="step" [class.active]="step >= 2" [class.done-step]="step > 2">
        <div class="step-dot"></div>
        <span>Clearing local data</span>
      </div>
      <div class="step" [class.active]="step >= 3">
        <div class="step-dot"></div>
        <span>Securing workspace</span>
      </div>
    </div>

    <!-- Progress bar (shown when done) -->
    <div class="progress-wrap" *ngIf="done">
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
      <span class="progress-label">Redirecting...</span>
    </div>

    <!-- Footer -->
    <div class="card-footer">
      <div class="brand">
        <div class="brand-logo">
          <img src="favicon.ico" alt="Dev Campus" />
        </div>
        <span>Dev Campus</span>
      </div>
      <div class="security-tag">
        <i class="ph-bold ph-shield-check"></i>
        <span>SSL Secured</span>
      </div>
    </div>

  </div>

</div>
