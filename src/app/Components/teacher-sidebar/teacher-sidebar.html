<!-- MOBILE HEADER -->
<header class="mobile-header">
  <div class="header-left">
    <button class="menu-trigger" (click)="toggle.emit()">
      <span class="burger-icon"></span>
    </button>
    <div class="mobile-logo">
      <img src="favicon.ico" alt="Dev Campus" />
    </div>
    <h3>{{ pageTitle }}</h3>
  </div>
  <div class="mobile-header-right">
    <app-theme-switcher></app-theme-switcher>
    <div class="avatar-xs">T</div>
  </div>
</header>

<!-- OVERLAY -->
<div class="sidebar-overlay" [class.show]="isOpen" (click)="close.emit()"></div>

<!-- SIDEBAR -->
<aside class="sidebar" [class.active]="isOpen">
  <div class="sidebar-header" (click)="goToTeacherHome()">
    <div class="sidebar-brand">
      <div class="sidebar-logo">
        <img src="favicon.ico" alt="Dev Campus" />
      </div>
      <span>Dev Campus</span>
    </div>
    <p class="sidebar-subtitle">Teacher Dashboard</p>
  </div>

  <nav class="nav-links">
    <button
      [class.active]="activeSection === 'see' || activeSection === 'studentsList'"
      (click)="goProblems.emit(); close.emit()">
      <i class="ph-bold ph-list-checks"></i>
      <span class="text">Problems List</span>
    </button>
    <button (click)="goAddStatement.emit(); close.emit()">
      <i class="ph-bold ph-plus-circle"></i>
      <span class="text">Add Statement</span>
    </button>
    <button (click)="goCampus.emit(); close.emit()">
      <i class="ph-bold ph-buildings"></i>
      <span class="text">Campus Info</span>
    </button>
    <a [routerLink]="['/changePassword']" [queryParams]="{from:'teacher'}"
       class="nav-item" routerLinkActive="active" (click)="close.emit()">
      <i class="ph-bold ph-lock-key"></i>
      <span class="text">Change Password</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <app-theme-switcher></app-theme-switcher>
    <button class="logout-btn" (click)="logoutClick.emit()">
      <i class="ph-bold ph-sign-out"></i> Logout
    </button>
  </div>
</aside>
