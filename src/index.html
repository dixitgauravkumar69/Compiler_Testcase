<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dev Campus</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Inline script: set theme BEFORE first paint to avoid flash -->
    <script>
      (function() {
        var saved = localStorage.getItem('pod-theme');
        var theme = (saved === 'light') ? 'light' : 'midnight';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <link rel="icon" type="image/x-icon" href="favicon.ico?v=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
